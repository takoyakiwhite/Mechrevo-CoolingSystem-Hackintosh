name: build

on:
  push:
  workflow_dispatch:

jobs:
  # 协议一致性回归：改了帧编码必须能在这里被抓出来
  protocol-check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: 协议一致性检查
        run: sh gui/check.sh

  cli:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version && xcodebuild -version

      - name: Build universal (arm64 + x86_64)
        run: |
          set -o pipefail
          swift build -c release --arch arm64 --arch x86_64 2>&1 | tail -40

      - name: Verify binary
        run: |
          set -o pipefail
          BIN=$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/wcooler
          ls -l "$BIN"
          lipo -info "$BIN"
          # 冒烟测试：无蓝牙权限/无设备时也应正常打印用法并退出
          "$BIN" --help || true

      - name: Package
        run: |
          set -o pipefail
          BIN=$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/wcooler
          mkdir -p dist
          cp "$BIN" dist/wcooler
          cd dist && zip -9 wcooler-macos-universal.zip wcooler

      - uses: actions/upload-artifact@v4
        with:
          name: wcooler-cli
          path: dist/wcooler-macos-universal.zip

  app:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build universal menu bar app
        run: sh gui/build-universal.sh

      - name: Package
        run: sh gui/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: WCooler-app
          path: dist/WCooler-app.zip
